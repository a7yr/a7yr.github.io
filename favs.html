<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorite songs ;D &lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --accent-color: #66fcf1;
      --accent-glow: rgba(102, 252, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #ffffff 30%, #66fcf1 100%);
    }

    body {
      background-color: #050505;
      color: #f0f0f5;
      display: flex;
      justify-content: center;
      padding: 45px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(5, 5, 5, 0) 70%);
      z-index: 0;
      pointer-events: none;
      filter: blur(70px);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
    }

    .subtitle {
      color: #a0a0ab;
      font-size: 0.92rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .status-card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .status-display {
      font-size: 0.92rem;
      color: #c5c5d0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .edit-toggle-btn {
      background: transparent;
      border: none;
      color: var(--accent-color);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }

    /* Admin Form Styling */
    .admin-form-group {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
    }

    .admin-form-group.active {
      display: flex;
    }

    .admin-form-group input, .admin-form-group textarea {
      background: #15151a;
      border: 1px solid #282830;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      resize: vertical;
    }

    .admin-form-group textarea {
      min-height: 60px;
    }

    .admin-form-group button {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Song Cards List */
    .fav-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .fav-card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .fav-main {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .fav-art {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
    }

    .fav-info h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 3px;
    }

    .fav-info p {
      color: #90909a;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .fav-snippet {
      background: #131318;
      border-left: 3px solid var(--accent-color);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      color: #d0d0d8;
      font-style: italic;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .play-snippet-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .audio-player-box {
      display: none;
      margin-top: 5px;
    }

    .audio-player-box.active {
      display: block;
    }

    .audio-player-box audio {
      width: 100%;
      height: 36px;
      outline: none;
    }

    .fav-lyrics {
      background: #101014;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #a5a5b0;
      white-space: pre-wrap;
      display: none;
    }

    .fav-lyrics.show {
      display: block;
    }

    .lyrics-toggle-btn {
      background: transparent;
      border: none;
      color: var(--accent-color);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .delete-btn {
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      align-self: flex-end;
      display: none;
    }

    .admin-mode .delete-btn {
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="wrapper" id="mainWrapper">
    <header>
      <h1>Favorite songs ;D &lt;3</h1>
      <div class="subtitle">
        <span>Goated List bwahahah</span>
      </div>
      <div style="margin-top: 10px;">
        <a href="index.html" class="nav-link">← Go back (￣o￣) . z Z</a>
      </div>
    </header>

    <div class="status-card">
      <div class="status-display">
        <span style="font-weight: 600; color: #a5a5b0;">Admin Management</span>
        <button class="edit-toggle-btn" id="toggleAdminBtn">Admin Login 🔒</button>
      </div>

      <div class="admin-form-group" id="adminFormGroup">
        <input type="text" id="songTitle" placeholder="Song Title (e.g. Blinding Lights)" />
        <input type="text" id="songArtist" placeholder="Artist Name (e.g. The Weeknd)" />
        <textarea id="songSnippet" placeholder="Vibe Snippet / Note (e.g. Late night highway drives)"></textarea>
        <input type="text" id="songAudio" placeholder="Direct Audio/MP3 Preview URL (e.g. https://.../preview.mp3)" />
        <textarea id="songLyrics" placeholder="Lyrics or Favorite Verse..."></textarea>
        <button id="saveSongBtn">Save Favorite Song</button>
      </div>
    </div>

    <div class="fav-list" id="favSongsContainer">
      <div class="fav-card">
        <div class="fav-info">
          <h3>Loading Favorites...</h3>
          <p>Please wait a moment</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    var ADMIN_PASSCODE = "aarav123";
    var RTDB_FAV_URL = "https://a7yrshitvc-default-rtdb.asia-southeast1.firebasedatabase.app/favorite_songs.json";
    var CLEAN_FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2315151a'/><circle cx='32' cy='32' r='12' fill='none' stroke='%23333' stroke-width='3'/></svg>";

    var isAdminLoggedIn = false;
    var toggleAdminBtn = document.getElementById("toggleAdminBtn");
    var adminFormGroup = document.getElementById("adminFormGroup");
    var mainWrapper = document.getElementById("mainWrapper");

    toggleAdminBtn.addEventListener("click", function() {
      if (!isAdminLoggedIn) {
        var pass = prompt("Enter Admin Passcode:");
        if (pass === ADMIN_PASSCODE) {
          isAdminLoggedIn = true;
          adminFormGroup.classList.add("active");
          mainWrapper.classList.add("admin-mode");
          toggleAdminBtn.innerText = "Lock Admin 🔓";
          loadFavorites();
        } else if (pass !== null) {
          alert("Incorrect Passcode!");
        }
      } else {
        isAdminLoggedIn = false;
        adminFormGroup.classList.remove("active");
        mainWrapper.classList.remove("admin-mode");
        toggleAdminBtn.innerText = "Admin Login 🔒";
        loadFavorites();
      }
    });

    function fetchArtwork(title, artist, callback) {
      var cleanT = (title || "").replace(/\(.*?\)|\[.*?\]/g, "").trim();
      var cleanA = (artist || "").split(/&|,/)[0].trim();
      var query = encodeURIComponent(cleanT + " " + cleanA);

      fetch("https://itunes.apple.com/search?term=" + query + "&entity=song&limit=1")
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (data && data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
            callback(data.results[0].artworkUrl100.replace("100x100bb", "600x600bb"));
          } else {
            callback(CLEAN_FALLBACK_SVG);
          }
        })
        .catch(function(){ callback(CLEAN_FALLBACK_SVG); });
    }

    function loadFavorites() {
      fetch(RTDB_FAV_URL)
        .then(function(res){ return res.json(); })
        .then(function(data){
          var container = document.getElementById("favSongsContainer");
          if (!container) return;

          var songs = Array.isArray(data) ? data : [];
          if (songs.length === 0) {
            container.innerHTML = '<div class="fav-card"><div class="fav-info"><h3>No Favorite Songs Yet</h3><p>Admin can add songs using the panel above.</p></div></div>';
            return;
          }

          var html = "";
          for (var i = 0; i < songs.length; i++) {
            var song = songs[i];
            var art = song.art || CLEAN_FALLBACK_SVG;
            html += '<div class="fav-card" data-index="' + i + '">' +
                      '<div class="fav-main">' +
                        '<img class="fav-art" id="fav-art-' + i + '" src="' + art + '" alt="" />' +
                        '<div class="fav-info" style="flex:1;">' +
                          '<h3>' + (song.title || "Unknown") + '</h3>' +
                          '<p>' + (song.artist || "Unknown") + '</p>' +
                        '</div>' +
                        (isAdminLoggedIn ? '<button class="delete-btn" onclick="deleteSong(' + i + ')">Delete</button>' : '') +
                      '</div>';
            
            if (song.snippet) {
              html += '<div class="fav-snippet">' +
                        '<span>“' + song.snippet + '”</span>' +
                        (song.audio ? '<button class="play-snippet-btn" onclick="toggleAudio(this)">▶ Play Snippet</button>' : '') +
                      '</div>';
            }

            if (song.audio) {
              html += '<div class="audio-player-box"><audio controls src="' + song.audio + '"></audio></div>';
            }

            if (song.lyrics) {
              html += '<button class="lyrics-toggle-btn" onclick="toggleLyrics(this)">Show Lyrics ▾</button>' +
                      '<div class="fav-lyrics">' + song.lyrics + '</div>';
            }

            html += '</div>';
          }
          container.innerHTML = html;

          for (var j = 0; j < songs.length; j++) {
            if (!songs[j].art || songs[j].art.indexOf("svg") !== -1) {
              (function(index, sItem){
                fetchArtwork(sItem.title, sItem.artist, function(resolvedArt){
                  var imgEl = document.getElementById("fav-art-" + index);
                  if (imgEl) imgEl.src = resolvedArt;
                });
              })(j, songs[j]);
            }
          }
        })
        .catch(function(){});
    }

    // Toggle Audio Player
    window.toggleAudio = function(btn) {
      var card = btn.closest(".fav-card");
      var playerBox = card.querySelector(".audio-player-box");
      var audioEl = playerBox.querySelector("audio");

      if (playerBox.classList.contains("active")) {
        playerBox.classList.remove("active");
        audioEl.pause();
        btn.innerText = "▶ Play Snippet";
      } else {
        // Pause all other playing audio elements first
        var allPlayers = document.querySelectorAll(".audio-player-box");
        var allBtns = document.querySelectorAll(".play-snippet-btn");
        allPlayers.forEach(function(box){ box.classList.remove("active"); });
        allBtns.forEach(function(b){ b.innerText = "▶ Play Snippet"; });
        var allAudios = document.querySelectorAll("audio");
        allAudios.forEach(function(a){ a.pause(); });

        playerBox.classList.add("active");
        audioEl.play();
        btn.innerText = "❚❚ Pause";
      }
    };

    window.toggleLyrics = function(btn) {
      var lyricsDiv = btn.nextElementSibling;
      if (lyricsDiv.classList.contains("show")) {
        lyricsDiv.classList.remove("show");
        btn.innerText = "Show Lyrics ▾";
      } else {
        lyricsDiv.classList.add("show");
        btn.innerText = "Hide Lyrics ▴";
      }
    };

    document.getElementById("saveSongBtn").addEventListener("click", function() {
      var title = document.getElementById("songTitle").value.trim();
      var artist = document.getElementById("songArtist").value.trim();
      var snippet = document.getElementById("songSnippet").value.trim();
      var audio = document.getElementById("songAudio").value.trim();
      var lyrics = document.getElementById("songLyrics").value.trim();

      if (!title || !artist) {
        alert("Please enter both Title and Artist!");
        return;
      }

      fetch(RTDB_FAV_URL)
        .then(function(res){ return res.json(); })
        .then(function(data){
          var songs = Array.isArray(data) ? data : [];

          fetchArtwork(title, artist, function(artUrl){
            var newEntry = {
              title: title,
              artist: artist,
              snippet: snippet,
              audio: audio,
              lyrics: lyrics,
              art: artUrl
            };

            songs.unshift(newEntry);

            fetch(RTDB_FAV_URL, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(songs)
            }).then(function() {
              document.getElementById("songTitle").value = "";
              document.getElementById("songArtist").value = "";
              document.getElementById("songSnippet").value = "";
              document.getElementById("songAudio").value = "";
              document.getElementById("songLyrics").value = "";
              adminFormGroup.classList.remove("active");
              loadFavorites();
            }).catch(function(){});
          });
        });
    });

    window.deleteSong = function(index) {
      if (!confirm("Delete this favorite song?")) return;

      fetch(RTDB_FAV_URL)
        .then(function(res){ return res.json(); })
        .then(function(data){
          var songs = Array.isArray(data) ? data : [];
          songs.splice(index, 1);

          fetch(RTDB_FAV_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(songs)
          }).then(function() {
            loadFavorites();
          }).catch(function(){});
        });
    };

    loadFavorites();
  </script>
</body>
</html>
