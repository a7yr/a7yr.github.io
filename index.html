<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaravReallyGoneCrazy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .live-time {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
      font-weight: 500;
    }

    .history-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-item img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
    }
    .history-info h4 {
      font-size: 14px;
      margin: 0;
      color: #fff;
    }
    .history-info p {
      font-size: 12px;
      margin: 2px 0 0 0;
      color: #888;
    }

    /* Real Animated Minions Styling (No broken images / no ?) */
    .minion-container {
      position: fixed;
      bottom: 10px;
      left: -120px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      animation: runAcross 16s linear infinite;
    }
    .minion-container.delay {
      animation-delay: 8s;
      bottom: auto;
      top: 15px;
      animation-duration: 20s;
      animation-direction: reverse;
    }
    .minion {
      width: 60px;
      height: 60px;
      object-fit: contain;
      animation: bounceMinion 0.4s ease-in-out infinite alternate;
    }
    @keyframes runAcross {
      0% { left: -140px; transform: scaleX(1); }
      49% { transform: scaleX(1); }
      50% { left: 105vw; transform: scaleX(-1); }
      99% { transform: scaleX(-1); }
      100% { left: -140px; transform: scaleX(1); }
    }
    @keyframes bounceMinion {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-6px) rotate(2deg); }
    }
  </style>
</head>
<body>

  <div class="mesh-background"></div>

  <!-- Real Minions Running Around (Using stable, reliable transparent PNG/GIF sprites) -->
  <div class="minion-container">
    <img src="https://i.giphy.com/media/132zB9W2eH45wQ/giphy.webp" class="minion" alt="Minion Running" onerror="this.style.display='none'">
    <img src="https://i.giphy.com/media/132zB9W2eH45wQ/giphy.webp" class="minion" style="transform: scale(0.8);" alt="Minion" onerror="this.style.display='none'">
  </div>
  <div class="minion-container delay">
    <img src="https://i.giphy.com/media/132zB9W2eH45wQ/giphy.webp" class="minion" style="transform: scale(0.9);" alt="Minion" onerror="this.style.display='none'">
  </div>

  <div class="container">
    <header>
      <h1>Aarav is Vibing to <3</h1>
      <p>Live music tracking bwhahaha</p>
      <div id="realtime-clock" class="live-time">Loading time...</div>
    </header>

    <main>
      <!-- Current Track Card -->
      <div class="glass-card now-playing">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span id="status-text">Now Playing</span>
        </div>
        
        <div class="track-info-container">
          <img id="album-art" src="https://placehold.co/150x150/111/333?text=Art" alt="Album Art" class="album-art">
          
          <div class="track-details">
            <h2 id="song-title" class="song-title">Loading track...</h2>
            <p id="artist-name" class="artist-name">Fetching data</p>
          </div>
        </div>
      </div>

      <!-- Recent Vibe History Section -->
      <div class="glass-card" style="margin-top: 20px;">
        <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff;">Recent Vibe History</h3>
        <div id="history-container" class="history-list">
          <p style="color: #666; font-size: 14px;">Loading recent history...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_KEY = 'b31d67b732b6bb6f66ca8f9c033b97c1'; 
    const USERNAME = 'a7yr';
    
    // Limit 30 kar diya hai taaki deep fetch ho aur history kabhi stuck na ho
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=30`;

    let activeTrackKey = "";

    // Live Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('realtime-clock').innerText = `Local Time: ${hours}:${minutes}:${seconds} ${ampm} 🕒`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Multi-Source Album Art Finder
    async function getBestAlbumArt(artist, song) {
      try {
        const query = encodeURIComponent(`${artist} ${song}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
        }
      } catch (e) {
        console.error("iTunes art fetch failed", e);
      }
      return null;
    }

    async function getLiveSongs() {
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const tracks = data.recenttracks.track;
        if (!tracks || tracks.length === 0) return;

        // 1. Main Current Track
        const currentTrack = tracks[0];
        const trackName = currentTrack.name;
        const artistName = currentTrack.artist['#text'];
        const trackUniqueKey = `${trackName}-${artistName}`;
        const isPlaying = currentTrack['@attr'] && currentTrack['@attr'].nowplaying === 'true';

        if (trackUniqueKey !== activeTrackKey) {
          activeTrackKey = trackUniqueKey;
          document.getElementById('song-title').innerText = trackName;
          document.getElementById('artist-name').innerText = artistName;

          let artUrl = (currentTrack.image && currentTrack.image[3] && currentTrack.image[3]['#text']) 
            ? currentTrack.image[3]['#text'] 
            : '';

          if (!artUrl || artUrl.includes('2a96cbd8b46e442fc41c2b86b821562f') || artUrl === '') {
            artUrl = await getBestAlbumArt(artistName, trackName) || 'https://placehold.co/150x150/111/333?text=No+Art';
          }
          
          document.getElementById('album-art').src = artUrl;
        }

        const indicatorText = document.getElementById('status-text');
        if (isPlaying) {
          indicatorText.innerText = "Now Playing";
          document.querySelector('.pulse-dot').style.backgroundColor = "#ff2a5f";
        } else {
          indicatorText.innerText = "Last Played";
          document.querySelector('.pulse-dot').style.backgroundColor = "#555";
        }

        // 2. Recent Vibe History (Fresh fetch with deep limit 30 to prevent getting stuck)
        const historyContainer = document.getElementById('history-container');
        historyContainer.innerHTML = ""; 

        let historyCount = 0;
        let seenTracks = new Set();
        seenTracks.add(`${trackName.toLowerCase()}-${artistName.toLowerCase()}`);

        for (let i = 1; i < tracks.length; i++) {
          const t = tracks[i];
          const tName = t.name;
          const tArtist = t.artist['#text'];
          const tKey = `${tName.toLowerCase()}-${tArtist.toLowerCase()}`;

          if (seenTracks.has(tKey)) continue;
          seenTracks.add(tKey);

          if (historyCount >= 10) break;

          let tArt = (t.image && t.image[1] && t.image[1]['#text']) ? t.image[1]['#text'] : '';
          if (!tArt || tArt.includes('2a96cbd8b46e442fc41c2b86b821562f') || tArt === '') {
            tArt = await getBestAlbumArt(tArtist, tName) || 'https://placehold.co/45x45/111/333?text=Art';
          }

          historyContainer.innerHTML += `
            <div class="history-item">
              <img src="${tArt}" alt="Art" onerror="this.src='https://placehold.co/45x45/111/333?text=Art'">
              <div class="history-info">
                <h4>${tName}</h4>
                <p>${tArtist}</p>
              </div>
            </div>
          `;
          historyCount++;
        }

            } catch (error) {
        console.error("Error fetching music data:", error);
      }
    }

    getLiveSongs();
    setInterval(getLiveSongs, 6000); 
  </script>
</body>
</html>
