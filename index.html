<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acentyr | Live Activity</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .history-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .history-item img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
    }
    .history-info h4 {
      font-size: 14px;
      margin: 0;
      color: #fff;
    }
    .history-info p {
      font-size: 12px;
      margin: 2px 0 0 0;
      color: #888;
    }
    .time-container {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #777;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="mesh-background"></div>

  <div class="container">
    <header>
      <h1>Aarav is Vibing to <3</h1>
      <p>Live music tracking bwhahaha</p>
    </header>

    <main>
      <!-- Current / Most Recent Track Card -->
      <div class="glass-card now-playing">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span id="status-text">Now Playing</span>
        </div>
        
        <div class="track-info-container">
          <img id="album-art" src="https://placehold.co/150x150/111/333?text=Art" alt="Album Art" class="album-art">
          
          <div class="track-details">
            <h2 id="song-title" class="song-title">Loading track...</h2>
            <p id="artist-name" class="artist-name">Fetching data</p>
            
            <div class="progress-bar-container" style="margin-top: 12px;">
              <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
              </div>
              <div class="time-container">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Last 10 Tracks History Section -->
      <div class="glass-card" style="margin-top: 20px;">
        <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff;">Recent Vibe History</h3>
        <div id="history-container" class="history-list">
          <p style="color: #666; font-size: 14px;">Loading recent history...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_KEY = 'b31d67b732b6bb6f66ca8f9c033b97c1'; 
    const USERNAME = 'a7yr';
    
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=10`;

    let lastTrackName = "";
    let trackDurationSec = 0;
    let trackStartTimeEpoch = 0;
    let isTrackPlaying = false;
    let pausedElapsedTime = 0; // Remembers exact spot when paused

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function getItunesDetails(artist, song) {
      try {
        const query = encodeURIComponent(`${artist} ${song}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const trackData = data.results[0];
          return {
            art: trackData.artworkUrl100.replace('100x100bb', '300x300bb'),
            duration: trackData.trackTimeMillis ? trackData.trackTimeMillis / 1000 : 210
          };
        }
      } catch (e) {
        console.error("iTunes fetch failed", e);
      }
      return { art: null, duration: 210 };
    }

    async function getLiveSongs() {
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const tracks = data.recenttracks.track;
        if (!tracks || tracks.length === 0) return;

        const currentTrack = tracks[0];
        const trackName = currentTrack.name;
        const artistName = currentTrack.artist['#text'];
        
        // Check if Last.fm explicitly says it's playing right now
        isTrackPlaying = currentTrack['@attr'] && currentTrack['@attr'].nowplaying === 'true';

        // Get start epoch timestamp
        if (currentTrack.date && currentTrack.date.uts) {
          trackStartTimeEpoch = parseInt(currentTrack.date.uts, 10);
        } else {
          trackStartTimeEpoch = Math.floor(Date.now() / 1000);
        }

        // Check if track changed
        if (trackName !== lastTrackName) {
          lastTrackName = trackName;
          pausedElapsedTime = 0; // Reset pause tracker for new song
          document.getElementById('song-title').innerText = trackName;
          document.getElementById('artist-name').innerText = artistName;

          let artUrl = (currentTrack.image && currentTrack.image[3] && currentTrack.image[3]['#text']) 
            ? currentTrack.image[3]['#text'] 
            : '';

          const itunes = await getItunesDetails(artistName, trackName);
          
          if (!artUrl || artUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
            artUrl = itunes.art || 'https://placehold.co/150x150/111/333?text=No+Art';
          }
          
          document.getElementById('album-art').src = artUrl;
          trackDurationSec = itunes.duration;
          document.getElementById('total-duration').innerText = formatTime(trackDurationSec);
        }

        const indicatorText = document.getElementById('status-text');
        if (isTrackPlaying) {
          indicatorText.innerText = "Now Playing";
          document.querySelector('.pulse-dot').style.backgroundColor = "#ff2a5f";
        } else {
          indicatorText.innerText = "Paused / Last Played";
          document.querySelector('.pulse-dot').style.backgroundColor = "#555";
        }

        // Render History List
        const historyContainer = document.getElementById('history-container');
        historyContainer.innerHTML = ""; 

        for (let i = 1; i < tracks.length; i++) {
          const t = tracks[i];
          let tArt = (t.image && t.image[1] && t.image[1]['#text']) ? t.image[1]['#text'] : 'https://placehold.co/40x40/111/333?text=?';

          historyContainer.innerHTML += `
            <div class="history-item">
              <img src="${tArt}" alt="Art">
              <div class="history-info">
                <h4>${t.name}</h4>
                <p>${t.artist['#text']}</p>
              </div>
            </div>
          `;
        }

      } catch (error) {
        console.error("Error fetching music data:", error);
      }
    }

    // Precise progress bar handler that freezes when paused
    function updateProgressAnimation() {
      if (trackDurationSec > 0) {
        let elapsedSec = 0;

        if (isTrackPlaying) {
          // If playing, calculate exact time based on real-world clock
          const nowEpoch = Math.floor(Date.now() / 1000);
          elapsedSec = nowEpoch - trackStartTimeEpoch;
          if (elapsedSec < 0) elapsedSec = 0;
          pausedElapsedTime = elapsedSec; // Save current spot
        } else {
          // If paused, freeze at the exact last known elapsed time
          elapsedSec = pausedElapsedTime;
        }
        
        let progressPercent = (elapsedSec / trackDurationSec) * 100;
        if (progressPercent > 100) progressPercent = 100;

        document.getElementById('progress-fill').style.width = `${progressPercent}%`;
        document.getElementById('current-time').innerText = formatTime(elapsedSec);
      }
    }

    getLiveSongs();
    setInterval(getLiveSongs, 10000); // Check Last.fm state every 10s
    setInterval(updateProgressAnimation, 1000); // UI tick every 1s
  </script>
</body>
</html>
