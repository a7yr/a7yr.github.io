      if (!imgElement || !imgElement.complete) return;
      try {

        if (color) {
          const rgbColor = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
          const glowColor = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.38)`;

          document.documentElement.style.setProperty('--accent-color', rgbColor);
          document.documentElement.style.setProperty('--accent-glow', glowColor);
          document.documentElement.style.setProperty('--accent-gradient', `linear-gradient(135deg, #ffffff 30%, ${rgbColor} 100%)`);
        }
      } catch (e) {
        document.documentElement.style.setProperty('--accent-color', '#ffffff');
