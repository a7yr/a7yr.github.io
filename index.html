<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaravReallyGoneCrazy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .history-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-item img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
    }
    .history-info h4 {
      font-size: 14px;
      margin: 0;
      color: #fff;
    }
    .history-info p {
      font-size: 12px;
      margin: 2px 0 0 0;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="mesh-background"></div>

  <div class="container">
    <header>
      <h1>Aarav is Vibing to <3</h1>
      <p>Live music tracking bwhahaha</p>
    </header>

    <main>
      <!-- Current Track Card -->
      <div class="glass-card now-playing">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span id="status-text">Now Playing</span>
        </div>
        
        <div class="track-info-container">
          <img id="album-art" src="https://placehold.co/150x150/111/333?text=Art" alt="Album Art" class="album-art">
          
          <div class="track-details">
            <h2 id="song-title" class="song-title">Loading track...</h2>
            <p id="artist-name" class="artist-name">Fetching data</p>
          </div>
        </div>
      </div>

      <!-- Recent Vibe History Section -->
      <div class="glass-card" style="margin-top: 20px;">
        <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff;">Recent Vibe History</h3>
        <div id="history-container" class="history-list">
          <p style="color: #666; font-size: 14px;">Loading recent history...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_KEY = 'b31d67b732b6bb6f66ca8f9c033b97c1'; 
    const USERNAME = 'a7yr';
    
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=5`;

    let activeTrackKey = "";
    let localSongHistory = []; // Browser memory jo har naye gaane ko turant top par add karegi

    async function getItunesArt(artist, song) {
      try {
        const query = encodeURIComponent(`${artist} ${song}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          return data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
        }
      } catch (e) {
        console.error("iTunes fetch failed", e);
      }
      return null;
    }

    async function getLiveSongs() {
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const tracks = data.recenttracks.track;
        if (!tracks || tracks.length === 0) return;

        const currentTrack = tracks[0];
        const trackName = currentTrack.name;
        const artistName = currentTrack.artist['#text'];
        const trackUniqueKey = `${trackName}-${artistName}`;
        
        const isPlaying = currentTrack['@attr'] && currentTrack['@attr'].nowplaying === 'true';

        // Agar gaana change hua hai, toh main card update karo aur purane wale ko history mein daal do!
        if (trackUniqueKey !== activeTrackKey) {
          
          // Agar pehle se koi active track tha, toh usko history ke top par push kar do
          if (activeTrackKey !== "") {
            const prevTitle = document.getElementById('song-title').innerText;
            const prevArtist = document.getElementById('artist-name').innerText;
            const prevArt = document.getElementById('album-art').src;

            // Check karo ki history mein already na ho taaki duplicate na bane
            const exists = localSongHistory.some(item => item.title === prevTitle && item.artist === prevArtist);
            if (!exists) {
              localSongHistory.unshift({ title: prevTitle, artist: prevArtist, art: prevArt });
              if (localSongHistory.length > 10) localSongHistory.pop(); // Sirf last 10 rakho
            }
          }

          activeTrackKey = trackUniqueKey;
          document.getElementById('song-title').innerText = trackName;
          document.getElementById('artist-name').innerText = artistName;

          let artUrl = (currentTrack.image && currentTrack.image[3] && currentTrack.image[3]['#text']) 
            ? currentTrack.image[3]['#text'] 
            : '';

          if (!artUrl || artUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
            artUrl = await getItunesArt(artistName, trackName) || 'https://placehold.co/150x150/111/333?text=No+Art';
          }
          
          document.getElementById('album-art').src = artUrl;
          
          // Render history instantly
          renderHistory();
        }

        const indicatorText = document.getElementById('status-text');
        if (isPlaying) {
          indicatorText.innerText = "Now Playing";
          document.querySelector('.pulse-dot').style.backgroundColor = "#ff2a5f";
        } else {
          indicatorText.innerText = "Last Played";
          document.querySelector('.pulse-dot').style.backgroundColor = "#555";
        }

      } catch (error) {
        console.error("Error fetching music data:", error);
      }
    }

    // Local history list ko screen par render karne ka function
    function renderHistory() {
      const historyContainer = document.getElementById('history-container');
      if (localSongHistory.length === 0) {
        historyContainer.innerHTML = `<p style="color: #666; font-size: 14px;">Play next song to build history...</p>`;
        return;
      }

      historyContainer.innerHTML = "";
      localSongHistoryforEach = localSongHistory.forEach(song => {
        historyContainer.innerHTML += `
          <div class="history-item">
            <img src="${song.art}" alt="Art">
            <div class="history-info">
              <h4>${song.title}</h4>
              <p>${song.artist}</p>
            </div>
          </div>
        `;
      });
    }

    // Fix for syntax safety in loop
    function renderHistory() {
      const historyContainer = document.getElementById('history-container');
      if (localSongHistory.length === 0) {
        historyContainer.innerHTML = `<p style="color: #666; font-size: 14px;">Play next song to build history...</p>`;
        return;
      }

      historyContainer.innerHTML = "";
      for (let song of localSongHistory) {
        historyContainer.innerHTML += `
          <div class="history-item">
            <img src="${song.art}" alt="Art">
            <div class="history-info">
              <h4>${song.title}</h4>
              <p>${song.artist}</p>
            </div>
          </div>
        `;
      }
    }

    getLiveSongs();
    setInterval(getLiveSongs, 6000); 
  </script>
</body>
</html>
