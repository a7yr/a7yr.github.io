<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarav is Vibing to &lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .card {
      background: #0f0f11;
      border: 1px solid #1a1a1e;
      border-radius: 16px;
      padding: 20px;
    }

    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #8e8e93;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #e50914;
      border-radius: 50%;
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background: #1a1a1e;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-lg h2 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .track-info-lg p {
      color: #a0a0a0;
      font-size: 0.95rem;
    }

    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0f0f11;
      border: 1px solid #18181c;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #1a1a1e;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .track-info-sm p {
      color: #888888;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">12:58:20 AM</span> 🕒</span>
      </div>
    </header>

    <div class="card now-playing-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="statusBadge">LAST PLAYED</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="https://via.placeholder.com/90/1a1a1e/555555?text=Art" alt="Album Art" />
        <div class="track-info-lg">
          <h2 id="currentTitle">Loading track...</h2>
          <p id="currentArtist">Please wait</p>
        </div>
      </div>
    </div>

    <div class="history-section">
      <h3>Recent Vibe History (Last 10 Songs)</h3>
      <div class="vibe-list" id="vibeHistoryList">
        <div class="vibe-item">
          <div class="track-info-sm">
            <h4>Loading Activity...</h4>
            <p>Fetching multi-source album covers...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6cTexajg5qthbeK3Z4lBwR-eIgojtI78",
      authDomain: "a7yrshitvc.firebaseapp.com",
      databaseURL: "https://a7yrshitvc-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "a7yrshitvc",
      storageBucket: "a7yrshitvc.firebasestorage.app",
      messagingSenderId: "383749658516",
      appId: "1:383749658516:web:5d2fc4b5b88c4191486181",
      measurementId: "G-HY0BJVR7WV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const LASTFM_USERNAME = "a7yr";
    const LASTFM_API_KEY = "b31d67b732b6bb6f66ca8f9c033b97c1"; 
    let lastSavedTrackKey = "";

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function cleanSearchQuery(title, artist) {
      const cleanedTitle = title.replace(/\(From ".*?"\)/gi, '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
      return { cleanedTitle, query: encodeURIComponent(`${cleanedTitle} ${artist}`) };
    }

    // MULTI-SOURCE SCRAPER (LAST.FM -> ITUNES -> DEEZER -> YT MUSIC -> MUSICBRAINZ)
    async function fetchBestAlbumArt(title, artist, defaultArt = "") {
      if (defaultArt && !defaultArt.includes("2a9b3a5c119d2a7156f7c70c778c3194") && !defaultArt.includes("placeholder")) {
        return defaultArt;
      }

      const { cleanedTitle, query } = cleanSearchQuery(title, artist);

      // 1. iTunes API
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
        }
      } catch (e) { console.warn("iTunes fetch failed"); }

      // 2. Deezer API
      try {
        const res = await fetch(`https://api.deezer.com/search?q=${query}&limit=1`);
        const data = await res.json();
        if (data.data && data.data.length > 0 && data.data[0].album && data.data[0].album.cover_medium) {
          return data.data[0].album.cover_medium;
        }
      } catch (e) { console.warn("Deezer fetch failed"); }

      // 3. YouTube Music / Invidious API Scraper Fallback
      try {
        const res = await fetch(`https://inv.tux.pizza/api/v1/search?q=${query}&type=video`);
        const data = await res.json();
        if (data && data.length > 0 && data[0].videoThumbnails) {
          const highResThumb = data[0].videoThumbnails.find(t => t.quality === 'high' || t.quality === 'medium');
          if (highResThumb) return highResThumb.url;
        }
      } catch (e) { console.warn("YT Music fetch failed"); }

      // 4. MusicBrainz API
      try {
        const res = await fetch(`https://musicbrainz.org/ws/2/recording/?query=recording:${encodeURIComponent(cleanedTitle)}%20AND%20artist:${encodeURIComponent(artist)}&fmt=json&limit=1`);
        const data = await res.json();
        if (data.recordings && data.recordings.length > 0 && data.recordings[0].releases && data.recordings[0].releases.length > 0) {
          const releaseId = data.recordings[0].releases[0].id;
          return `https://coverartarchive.org/release/${releaseId}/front-250`;
        }
      } catch (e) { console.warn("MusicBrainz fetch failed"); }

      return "https://via.placeholder.com/90/1a1a1e/888888?text=Art";
    }

    async function saveTrackToDb(title, artist, artUrl) {
      try {
        await addDoc(collection(db, "vibe_history"), {
          title: title,
          artist: artist,
          artUrl: artUrl || "",
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Firebase save error:", err);
      }
    }

    async function fetchLastFmActivity() {
      const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=1`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.recenttracks && data.recenttracks.track.length > 0) {
          const currentTrack = data.recenttracks.track[0];
          const currentTitle = currentTrack.name;
          const currentArtist = currentTrack.artist['#text'];
          let rawArt = currentTrack.image ? currentTrack.image[2]['#text'] : "";
          const isNowPlaying = currentTrack['@attr'] && currentTrack['@attr'].nowplaying === "true";

          const bestArt = await fetchBestAlbumArt(currentTitle, currentArtist, rawArt);

          document.getElementById('statusBadge').innerText = isNowPlaying ? "NOW PLAYING" : "LAST PLAYED";
          document.getElementById('currentTitle').innerText = currentTitle;
          document.getElementById('currentArtist').innerText = currentArtist;
          document.getElementById('currentArt').src = bestArt;

          const currentKey = `${currentArtist} - ${currentTitle}`;
          if (currentKey !== lastSavedTrackKey) {
            lastSavedTrackKey = currentKey;
            await saveTrackToDb(currentTitle, currentArtist, bestArt);
          }
        }
      } catch (err) {
        console.warn("Last.fm fetch error:", err);
      }
    }

    function listenToVibeHistory() {
      const q = query(collection(db, "vibe_history"), orderBy("createdAt", "desc"), limit(10));

      onSnapshot(q, (snapshot) => {
        const container = document.getElementById("vibeHistoryList");
        if (!container) return;

        if (snapshot.empty) {
          container.innerHTML = "<p style='color:#666; font-size:0.9rem;'>No vibe history found.</p>";
          return;
        }

        container.innerHTML = snapshot.docs.map(doc => {
          const data = doc.data();
          const artUrl = data.artUrl || "https://via.placeholder.com/48/1a1a1e/888888?text=Art";

          return `
            <div class="vibe-item">
              <img class="album-art-sm" src="${escapeHTML(artUrl)}" alt="Art" onerror="this.src='https://via.placeholder.com/48/1a1a1e/888888?text=Art'" />
              <div class="track-info-sm">
                <h4>${escapeHTML(data.title || "Unknown Title")}</h4>
                <p>${escapeHTML(data.artist || "Unknown Artist")}</p>
              </div>
            </div>
          `;
        }).join("");
      });
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    listenToVibeHistory();
    fetchLastFmActivity();
    setInterval(fetchLastFmActivity, 10000);
  </script>
</body>
</html>
