<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AaravReallyGoneCrazy&lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --accent-color: #66fcf1;
      --accent-glow: rgba(102, 252, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #ffffff 30%, #66fcf1 100%);
    }

    body {
      background-color: #050505;
      color: #f0f0f5;
      display: flex;
      justify-content: center;
      padding: 45px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(5, 5, 5, 0) 70%);
      z-index: 0;
      pointer-events: none;
      filter: blur(70px);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
    }

    .subtitle {
      color: #a0a0ab;
      font-size: 0.92rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .status-card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .status-display {
      font-size: 0.92rem;
      color: #c5c5d0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-pill {
      font-weight: 700;
      color: var(--accent-color);
      word-break: break-word;
    }

    .edit-toggle-btn {
      background: transparent;
      border: none;
      color: #6e6e7a;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }

    .status-input-group {
      display: none;
      gap: 8px;
      margin-top: 4px;
    }

    .status-input-group.active {
      display: flex;
    }

    .status-input-group input {
      flex: 1;
      background: #15151a;
      border: 1px solid #282830;
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .status-input-group button {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
    }

    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-color: var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8e8e98;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 92px;
      height: 92px;
      border-radius: 12px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .track-info-lg h2 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .track-info-lg p {
      color: #a5a5b0;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: #f0f0f5;
    }

    .track-info-sm p {
      color: #888892;
      font-size: 0.83rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="wrapper">
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">--:--:--</span> 🕒</span>
      </div>
      <div style="margin-top: 10px;">
        <a href="favs.html" class="nav-link">♥ View Favorite Songs</a>
      </div>
    </header>

    <div class="status-card">
      <div class="status-display">
        <div>
          <span style="color: #90909a; font-weight: 500;">Current Mood:</span>
          <span class="status-pill" id="liveStatusText">Chillin &amp; Listening 🎧</span>
        </div>
        <button class="edit-toggle-btn" id="toggleEditBtn">Edit Mood 🔒</button>
      </div>

      <div class="status-input-group" id="statusInputGroup">
        <input type="text" id="statusInput" placeholder="Enter new vibe status..." />
        <button id="updateStatusBtn">Save</button>
      </div>
    </div>

    <div class="card now-playing-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="statusBadge">NOW PLAYING</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='92' viewBox='0 0 92 92'><rect width='92' height='92' fill='%2315151a'/><circle cx='46' cy='46' r='18' fill='none' stroke='%23333' stroke-width='4'/></svg>" alt="" />
        <div class="track-info-lg">
          <h2 id="currentTitle">Fetching Vibe...</h2>
          <p id="currentArtist">Live track loading</p>
        </div>
      </div>
    </div>
