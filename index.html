<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarav is Vibing to &lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .card {
      background: #0f0f11;
      border: 1px solid #1a1a1e;
      border-radius: 16px;
      padding: 20px;
    }

    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #8e8e93;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #e50914;
      border-radius: 50%;
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background: #1a1a1e;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-lg h2 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .track-info-lg p {
      color: #a0a0a0;
      font-size: 0.95rem;
    }

    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0f0f11;
      border: 1px solid #18181c;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #1a1a1e;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .track-info-sm p {
      color: #888888;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">--:--:--</span> 🕒</span>
      </div>
    </header>

    <div class="card now-playing-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="statusBadge">NOW PLAYING</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=60" alt="Album Art" />
        <div class="track-info-lg">
          <h2 id="currentTitle">Loading track...</h2>
          <p id="currentArtist">Please wait</p>
        </div>
      </div>
    </div>

    <div class="history-section">
      <h3>Recent Vibe History (Last 10 Songs)</h3>
      <div class="vibe-list" id="vibeHistoryList">
        <div class="vibe-item">
          <div class="track-info-sm">
            <h4>Loading Activity...</h4>
            <p>Syncing live history...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LASTFM_USERNAME = "a7yr";
    const LASTFM_API_KEY = "b31d67b732b6bb6f66ca8f9c033b97c1";

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // CORS-bypass enabled cover search
    async function resolveCoverArt(title, artist, defaultArt) {
      // 1. If Last.fm already provides a valid non-star cover
      if (defaultArt && defaultArt.trim() !== "" && !defaultArt.includes("2a9b3a5c119d2a7156f7c70c778c3194")) {
        return defaultArt;
      }

      const cleanTitle = title.replace(/\(from ".*?"\)/gi, '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
      const cleanArtist = artist.split(/&|,|feat\.|ft\./i)[0].trim();
      const query = encodeURIComponent(`${cleanTitle} ${cleanArtist}`);

      // 2. iTunes JSONP / Corsproxy Mirror (Works 100% for Bollywood, Regional & Pop)
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://itunes.apple.com/search?term=' + query + '&entity=song&limit=1')}`);
        const data = await res.json();
        const parsed = JSON.parse(data.contents);
        if (parsed.results && parsed.results.length > 0 && parsed.results[0].artworkUrl100) {
          return parsed.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
        }
      } catch (e) {}

      // 3. Fallback iTunes Direct Search
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const parsed = await res.json();
        if (parsed.results && parsed.results.length > 0 && parsed.results[0].artworkUrl100) {
          return parsed.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
        }
      } catch (e) {}

      // High Quality Dark Fallback Cover (No Star)
      return "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=60";
    }

    async function syncMusicHistory() {
      const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=10`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.recenttracks && data.recenttracks.track.length > 0) {
          const tracks = data.recenttracks.track;
          const currentTrack = tracks[0];

          const isNowPlaying = currentTrack['@attr'] && currentTrack['@attr'].nowplaying === "true";
          const title = currentTrack.name;
          const artist = currentTrack.artist['#text'];
          const rawArt = currentTrack.image ? currentTrack.image[currentTrack.image.length - 1]['#text'] : "";

          document.getElementById('statusBadge').innerText = isNowPlaying ? "NOW PLAYING" : "LAST PLAYED";
          document.getElementById('currentTitle').innerText = title;
          document.getElementById('currentArtist').innerText = artist;

          // Set Now Playing Art
          const nowPlayingCover = await resolveCoverArt(title, artist, rawArt);
          document.getElementById('currentArt').src = nowPlayingCover;

          // Render live last 10 tracks
          const historyContainer = document.getElementById('vibeHistoryList');
          
          const historyHtml = await Promise.all(tracks.slice(0, 10).map(async (track) => {
            const tTitle = track.name;
            const tArtist = track.artist['#text'];
            const tRawArt = track.image ? track.image[track.image.length - 1]['#text'] : "";

            const coverUrl = await resolveCoverArt(tTitle, tArtist, tRawArt);

            return `
              <div class="vibe-item">
                <img class="album-art-sm" src="${escapeHTML(coverUrl)}" alt="Art" />
                <div class="track-info-sm">
                  <h4>${escapeHTML(tTitle)}</h4>
                  <p>${escapeHTML(tArtist)}</p>
                </div>
              </div>
            `;
          }));

          historyContainer.innerHTML = historyHtml.join('');
        }
      } catch (err) {
        console.warn("Sync error:", err);
      }
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    syncMusicHistory();
    setInterval(syncMusicHistory, 5000); // 5s smooth polling
  </script>
</body>
</html>
