<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AaravReallyGoneCrazy&lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --accent-color: #66fcf1;
      --accent-glow: rgba(102, 252, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #ffffff 30%, #66fcf1 100%);
    }

    body {
      background-color: #050505;
      color: #f0f0f5;
      display: flex;
      justify-content: center;
      padding: 45px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(5, 5, 5, 0) 70%);
      z-index: 0;
      pointer-events: none;
      filter: blur(70px);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
    }

    .subtitle {
      color: #a0a0ab;
      font-size: 0.92rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .status-card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .status-display {
      font-size: 0.92rem;
      color: #c5c5d0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-pill {
      font-weight: 700;
      color: var(--accent-color);
      word-break: break-word;
    }

    .edit-toggle-btn {
      background: transparent;
      border: none;
      color: #6e6e7a;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }

    .status-input-group {
      display: none;
      gap: 8px;
      margin-top: 4px;
    }

    .status-input-group.active {
      display: flex;
    }

    .status-input-group input {
      flex: 1;
      background: #15151a;
      border: 1px solid #282830;
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .status-input-group button {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
    }

    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-color: var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8e8e98;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 92px;
      height: 92px;
      border-radius: 12px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .track-info-lg h2 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .track-info-lg p {
      color: #a5a5b0;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: #f0f0f5;
    }

    .track-info-sm p {
      color: #888892;
      font-size: 0.83rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="wrapper">
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">--:--:--</span> 🕒</span>
      </div>
      <div style="margin-top: 10px;">
        <a href="favs.html" class="nav-link">♥ View Favorite Songs</a>
      </div>
    </header>

    <div class="status-card">
      <div class="status-display">
        <div>
          <span style="color: #90909a; font-weight: 500;">Current Mood:</span>
          <span class="status-pill" id="liveStatusText">Chillin &amp; Listening 🎧</span>
        </div>
        <button class="edit-toggle-btn" id="toggleEditBtn">Edit Mood 🔒</button>
      </div>

      <div class="status-input-group" id="statusInputGroup">
        <input type="text" id="statusInput" placeholder="Enter new vibe status..." />
        <button id="updateStatusBtn">Save</button>
      </div>
    </div>

    <div class="card now-playing-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="statusBadge">NOW PLAYING</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='92' viewBox='0 0 92 92'><rect width='92' height='92' fill='%2315151a'/><circle cx='46' cy='46' r='18' fill='none' stroke='%23333' stroke-width='4'/></svg>" alt="" />
        <div class="track-info-lg">
          <h2 id="currentTitle">Fetching Vibe...</h2>
          <p id="currentArtist">Live track loading</p>
        </div>
      </div>
    </div>

    <div class="history-section">
      <h3>Recent Activities ^_^</h3>
      <div class="vibe-list" id="vibeHistoryList">
        <div class="vibe-item">
          <div class="track-info-sm">
            <h4>Syncing History...</h4>
            <p>Please wait a moment</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var LASTFM_USERNAME = "a7yr";
    var LASTFM_API_KEY = "b31d67b732b6bb6f66ca8f9c033b97c1";
    var ADMIN_PASSCODE = "aarav123";
    var RTDB_MOOD_URL = "https://a7yrshitvc-default-rtdb.asia-southeast1.firebasedatabase.app/current_mood.json";
    var CLEAN_FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='92' viewBox='0 0 92 92'><rect width='92' height='92' fill='%2315151a'/><circle cx='46' cy='46' r='18' fill='none' stroke='%23333' stroke-width='4'/></svg>";

    var lastRenderedHash = "";

    // Clock Engine
    function runClock() {
      try {
        var now = new Date();
        var clockEl = document.getElementById('clock');
        if (clockEl) {
          clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }
      } catch (e) {}
    }
    setInterval(runClock, 1000);
    runClock();

    // Admin Toggle
    var toggleEditBtn = document.getElementById("toggleEditBtn");
    var statusInputGroup = document.getElementById("statusInputGroup");
    var statusElem = document.getElementById("liveStatusText");

    if (toggleEditBtn) {
      toggleEditBtn.addEventListener("click", function() {
        try {
          if (statusInputGroup.classList.contains("active")) {
            statusInputGroup.classList.remove("active");
            toggleEditBtn.innerText = "Edit Mood 🔒";
          } else {
            var pass = prompt("Enter Admin Secret Key to edit mood:");
            if (pass === ADMIN_PASSCODE) {
              statusInputGroup.classList.add("active");
              toggleEditBtn.innerText = "Close ✖";
            } else if (pass !== null) {
              alert("Incorrect Passcode!");
            }
          }
        } catch(e){}
      });
    }

    function updateCustomStatus(text) {
      if (!text || !text.trim()) return;
      var cleanText = text.trim();
      fetch(RTDB_MOOD_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cleanText, updatedAt: new Date().toISOString() })
      }).then(function() {
        if (statusElem) statusElem.innerText = cleanText;
        var inp = document.getElementById("statusInput");
        if (inp) inp.value = "";
        if (statusInputGroup) statusInputGroup.classList.remove("active");
        if (toggleEditBtn) toggleEditBtn.innerText = "Edit Mood 🔒";
      }).catch(function(e){});
    }

    var updateBtn = document.getElementById("updateStatusBtn");
    if (updateBtn) {
      updateBtn.addEventListener("click", function() {
        var input = document.getElementById("statusInput");
        if (input) updateCustomStatus(input.value);
      });
    }

    function fetchUniversalMood() {
      try {
        fetch(RTDB_MOOD_URL)
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data && data.text && statusElem) {
              statusElem.innerText = data.text;
            }
          })
          .catch(function(e){});
      } catch(e){}
    }

    // Direct iTunes High-Res Cover Art Fetcher
    function fetchArtwork(title, artist, rawArt, callback) {
      try {
        if (rawArt && rawArt.indexOf("2a9b3a5c119d2a7156f7c70c778c3194") === -1 && rawArt.indexOf("star") === -1) {
          callback(rawArt);
          return;
        }

        var cleanT = (title || "").replace(/\(.*?\)|\[.*?\]/g, "").replace(/from ".*?"/gi, "").trim();
        var cleanA = (artist || "").split(/&|,/)[0].trim();
        var query = encodeURIComponent(cleanT + " " + cleanA);

        fetch("https://itunes.apple.com/search?term=" + query + "&entity=song&limit=1")
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (data && data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
              callback(data.results[0].artworkUrl100.replace("100x100bb", "600x600bb"));
            } else {
              callback(CLEAN_FALLBACK_SVG);
            }
          })
          .catch(function(){
            callback(CLEAN_FALLBACK_SVG);
          });
      } catch(e) {
        callback(CLEAN_FALLBACK_SVG);
      }
    }

    // Dynamic Sync Engine for Now Playing & Recent Activities
    function checkLiveLastFmTrack() {
      try {
        var url = "https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=" + LASTFM_USERNAME + "&api_key=" + LASTFM_API_KEY + "&format=json&limit=10&_=" + Date.now();
        
        fetch(url)
          .then(function(res){ return res.json(); })
          .then(function(data){
            try {
              if (!data || !data.recenttracks || !data.recenttracks.track || data.recenttracks.track.length === 0) return;

              var tracks = data.recenttracks.track;
              var current = tracks[0];
              var title = current.name || "Unknown Track";
              var artist = (current.artist && current.artist['#text']) ? current.artist['#text'] : "Unknown Artist";
              var rawArt = (current.image && current.image.length > 0) ? current.image[current.image.length - 1]['#text'] : "";
              var isNowPlaying = current['@attr'] && current['@attr'].nowplaying === "true";

              var badge = document.getElementById('statusBadge');
              var titleEl = document.getElementById('currentTitle');
              var artistEl = document.getElementById('currentArtist');
              var artEl = document.getElementById('currentArt');

              if (badge) badge.innerText = isNowPlaying ? "NOW PLAYING" : "LAST PLAYED";
              if (titleEl) titleEl.innerText = title;
              if (artistEl) artistEl.innerText = artist;

              fetchArtwork(title, artist, rawArt, function(imgSrc){
                if (artEl) artEl.src = imgSrc;
              });

              // Recent Activities Dynamic Check & Update
              var historyContainer = document.getElementById('vibeHistoryList');
              if (historyContainer) {
                var historyTracks = isNowPlaying ? tracks.slice(1, 6) : tracks.slice(0, 5);
                var newHash = historyTracks.map(function(t){ return (t.name || "") + "_" + (t.artist ? t.artist['#text'] : ""); }).join("|");

                if (newHash !== lastRenderedHash) {
                  lastRenderedHash = newHash;

                  var html = "";
                  for (var i = 0; i < historyTracks.length; i++) {
                    var t = historyTracks[i];
                    var tTitle = t.name || "Unknown Track";
                    var tArtist = (t.artist && t.artist['#text']) ? t.artist['#text'] : "Unknown Artist";
                    html += '<div class="vibe-item">' +
                              '<img class="album-art-sm" id="h-img-' + i + '" src="' + CLEAN_FALLBACK_SVG + '" alt=""/>' +
                              '<div class="track-info-sm">' +
                                '<h4>' + tTitle + '</h4>' +
                                '<p>' + tArtist + '</p>' +
                              '</div>' +
                            '</div>';
                  }
                  historyContainer.innerHTML = html;

                  for (var j = 0; j < historyTracks.length; j++) {
                    (function(index, trackItem){
                      var itemTitle = trackItem.name || "";
                      var itemArtist = (trackItem.artist && trackItem.artist['#text']) ? trackItem.artist['#text'] : "";
                      var itemRawArt = (trackItem.image && trackItem.image.length > 0) ? trackItem.image[trackItem.image.length - 1]['#text'] : "";
                      fetchArtwork(itemTitle, itemArtist, itemRawArt, function(imgSrc){
                        var imgTarget = document.getElementById('h-img-' + index);
                        if (imgTarget) imgTarget.src = imgSrc;
                      });
                    })(j, historyTracks[j]);
                  }
                }
              }
            } catch(innerErr) {}
          })
          .catch(function(err){});
      } catch(outerErr) {}
    }

    fetchUniversalMood();
    checkLiveLastFmTrack();

    setInterval(fetchUniversalMood, 4000);
    setInterval(checkLiveLastFmTrack, 4000);
  </script>
</body>
</html>
