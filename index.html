<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaravReallyGoneCrazy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    .history-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .history-item img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
    }
    .history-info h4 {
      font-size: 14px;
      margin: 0;
      color: #fff;
    }
    .history-info p {
      font-size: 12px;
      margin: 2px 0 0 0;
      color: #888;
    }
    .time-container {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #777;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="mesh-background"></div>

  <div class="container">
    <header>
      <h1>Aarav is Vibing to <3</h1>
      <p>Live music tracking bwhahaha</p>
    </header>

    <main>
      <!-- Current / Most Recent Track Card -->
      <div class="glass-card now-playing">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span id="status-text">Now Playing</span>
        </div>
        
        <div class="track-info-container">
          <img id="album-art" src="https://placehold.co/150x150/111/333?text=Art" alt="Album Art" class="album-art">
          
          <div class="track-details">
            <h2 id="song-title" class="song-title">Loading track...</h2>
            <p id="artist-name" class="artist-name">Fetching data</p>
            
            <div class="progress-bar-container" style="margin-top: 12px;">
              <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
              </div>
              <div class="time-container">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Last 10 Tracks History Section -->
      <div class="glass-card" style="margin-top: 20px;">
        <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff;">Recent Vibe History</h3>
        <div id="history-container" class="history-list">
          <p style="color: #666; font-size: 14px;">Loading recent history...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_KEY = 'b31d67b732b6bb6f66ca8f9c033b97c1'; 
    const USERNAME = 'a7yr';
    
    const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=15`;

    let activeTrackKey = "";
    let trackDurationSec = 0;
    let trackStartEpoch = 0;
    let isTrackPlaying = false;
    let frozenElapsedSec = 0;
    let lastKnownPlayingTrack = null; // Ghost track / Khayaal bug ko rokne ke liye permanent lock

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function getItunesDetails(artist, song) {
      try {
        const query = encodeURIComponent(`${artist} ${song}`);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const trackData = data.results[0];
          return {
            art: trackData.artworkUrl100.replace('100x100bb', '300x300bb'),
            duration: trackData.trackTimeMillis ? trackData.trackTimeMillis / 1000 : 210
          };
        }
      } catch (e) {
        console.error("iTunes fetch failed", e);
      }
      return { art: null, duration: 210 };
    }

    async function getLiveSongs() {
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        const tracks = data.recenttracks.track;
        if (!tracks || tracks.length === 0) return;

        // Check if any track is currently playing right now
        let playingTrack = null;
        for (let i = 0; i < Math.min(tracks.length, 3); i++) {
          if (tracks[i]['@attr'] && tracks[i]['@attr'].nowplaying === 'true') {
            playingTrack = tracks[i];
            break;
          }
        }

        let currentTrack;
        if (playingTrack) {
          // Agar gaana chal raha hai, toh wahi lo aur save karke rakho
          currentTrack = playingTrack;
          lastKnownPlayingTrack = playingTrack;
          isTrackPlaying = true;
        } else if (lastKnownPlayingTrack) {
          // Agar pause ho gaya hai, toh Khayaal ko lane ki jagah last known playing track ko hi freeze rakho!
          currentTrack = lastKnownPlayingTrack;
          isTrackPlaying = false;
        } else {
          currentTrack = tracks[0];
          isTrackPlaying = false;
        }

        const trackName = currentTrack.name;
        const artistName = currentTrack.artist['#text'];
        const trackUniqueKey = `${trackName}-${artistName}`;

        // Agar naya gaana laga hai tabhi details aur timer reset karo
        if (trackUniqueKey !== activeTrackKey) {
          activeTrackKey = trackUniqueKey;
          document.getElementById('song-title').innerText = trackName;
          document.getElementById('artist-name').innerText = artistName;

          if (currentTrack.date && currentTrack.date.uts) {
            trackStartEpoch = parseInt(currentTrack.date.uts, 10);
          } else {
            trackStartEpoch = Math.floor(Date.now() / 1000);
          }
          frozenElapsedSec = 0;

          let artUrl = (currentTrack.image && currentTrack.image[3] && currentTrack.image[3]['#text']) 
            ? currentTrack.image[3]['#text'] 
            : '';

          const itunes = await getItunesDetails(artistName, trackName);
          
          if (!artUrl || artUrl.includes('2a96cbd8b46e442fc41c2b86b821562f')) {
            artUrl = itunes.art || 'https://placehold.co/150x150/111/333?text=No+Art';
          }
          
          document.getElementById('album-art').src = artUrl;
          trackDurationSec = itunes.duration;
          document.getElementById('total-duration').innerText = formatTime(trackDurationSec);
        }

        const indicatorText = document.getElementById('status-text');
        if (isTrackPlaying) {
          indicatorText.innerText = "Now Playing";
          document.querySelector('.pulse-dot').style.backgroundColor = "#ff2a5f";
        } else {
          indicatorText.innerText = "Paused / Last Played";
          document.querySelector('.pulse-dot').style.backgroundColor = "#555";
        }

        // Render Recent Vibe History (Fresh fetch, skipping active track)
        const historyContainer = document.getElementById('history-container');
        historyContainer.innerHTML = ""; 

        let historyCount = 0;
        for (let i = 0; i < tracks.length; i++) {
          const t = tracks[i];
          // Skip if it's the exact track currently shown on the main card
          if (t.name === trackName && t.artist['#text'] === artistName) continue;
          if (historyCount >= 10) break; 

          let tArt = (t.image && t.image[1] && t.image[1]['#text']) ? t.image[1]['#text'] : 'https://placehold.co/40x40/111/333?text=?';

          historyContainer.innerHTML += `
            <div class="history-item">
              <img src="${tArt}" alt="Art">
              <div class="history-info">
                <h4>${t.name}</h4>
                <p>${t.artist['#text']}</p>
              </div>
            </div>
          `;
          historyCount++;
        }

      } catch (error) {
        console.error("Error fetching music data:", error);
      }
    }

    function updateProgressAnimation() {
      let currentElapsedSec = 0;

      if (isTrackPlaying && trackStartEpoch > 0) {
        const nowEpoch = Math.floor(Date.now() / 1000);
        currentElapsedSec = nowEpoch - trackStartEpoch;
        
        if (currentElapsedSec > trackDurationSec) {
          currentElapsedSec = trackDurationSec;
        }
        frozenElapsedSec = currentElapsedSec; // Save exact point
      } else {
        // Paused hone par exact frozen second par lock rahega
        currentElapsedSec = frozenElapsedSec;
      }

      let progressPercent = trackDurationSec > 0 ? (currentElapsedSec / trackDurationSec) * 100 : 0;
      if (progressPercent > 100) progressPercent = 100;

      document.getElementById('progress-fill').style.width = `${progressPercent}%`;
      document.getElementById('current-time').innerText = formatTime(currentElapsedSec);
    }

    getLiveSongs();
    setInterval(getLiveSongs, 6000); // Check faster (every 6s) for instant pause/play reaction
    setInterval(updateProgressAnimation, 1000); 
  </script>
</body>
</html>
