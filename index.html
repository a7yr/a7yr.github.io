    const CLEAN_FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='92' viewBox='0 0 92 92'><rect width='92' height='92' fill='%2315151a'/><circle cx='46' cy='46' r='18' fill='none' stroke='%23333' stroke-width='4'/></svg>";

    function updateClock() {
      try {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString([], {
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
      } catch(e){}
    }
    setInterval(updateClock, 1000);
    updateClock();

    const toggleEditBtn = document.getElementById("toggleEditBtn");
    const statusInputGroup = document.getElementById("statusInputGroup");
    const statusElem = document.getElementById("liveStatusText");

    toggleEditBtn.addEventListener("click", () => {
      if (statusInputGroup.classList.contains("active")) {
        statusInputGroup.classList.remove("active");
        toggleEditBtn.innerText = "Edit Mood 🔒";
      } else {
        const pass = prompt("Enter Admin Secret Key to edit mood:");
        if (pass === ADMIN_PASSCODE) {
          statusInputGroup.classList.add("active");
          toggleEditBtn.innerText = "Close ✖";
        } else if (pass !== null) {
          alert("Incorrect Passcode!");
        }
      }
    });

    async function fetchUniversalMood() {
      try {
        const res = await fetch(RTDB_MOOD_URL);
        if (res.ok) {
          const data = await res.json();
          if (data && data.text) statusElem.innerText = data.text;
        }
      } catch (e) {}
    }

    async function updateCustomStatus(statusText) {
      if (!statusText || !statusText.trim()) return;
      try {
        await fetch(RTDB_MOOD_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: statusText.trim(), updatedAt: new Date().toISOString() })
        });
        statusElem.innerText = statusText.trim();
        document.getElementById("statusInput").value = "";
        statusInputGroup.classList.remove("active");
        toggleEditBtn.innerText = "Edit Mood 🔒";
      } catch (e) {}
    }

    document.getElementById("updateStatusBtn").addEventListener("click", () => {
      updateCustomStatus(document.getElementById("statusInput").value);
    });

    async function getCoverArt(title, artist, rawArt) {
      if (rawArt && !rawArt.includes("2a9b3a5c119d2a7156f7c70c778c3194") && !rawArt.includes("star")) {
        return rawArt;
      }
      try {
        const cleanT = (title || "").replace(/\(.*?\)|\[.*?\]/g, "").trim();
        const cleanA = (artist || "").split(/&|,/)[0].trim();
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanT + " " + cleanA)}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace("100x100bb", "600x600bb");
        }
      } catch (e) {}
      return CLEAN_FALLBACK_SVG;
    }

          document.getElementById('currentArtist').innerText = artist;

            const el = document.getElementById('currentArt');
            if(el) el.src = art;
          });

          const historyContainer = document.getElementById('vibeHistoryList');
