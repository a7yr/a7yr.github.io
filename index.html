<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarav is Vibing to <3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Header */
    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Card Base */
    .card {
      background: #0f0f11;
      border: 1px solid #1a1a1e;
      border-radius: 16px;
      padding: 20px;
    }

    /* Currently Playing Card */
    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #8e8e93;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #e50914;
      border-radius: 50%;
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background: #1a1a1e;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .track-info-lg h2 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .track-info-lg p {
      color: #a0a0a0;
      font-size: 0.95rem;
    }

    /* Recent Vibe History Section */
    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0f0f11;
      border: 1px solid #18181c;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #1a1a1e;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .track-info-sm p {
      color: #888888;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Header -->
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">12:51:17 AM</span> 🕒</span>
      </div>
    </header>

    <!-- Currently / Last Played Card -->
    <div class="card now-playing-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="statusBadge">LAST PLAYED</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="" alt="Album Art" style="display: none;" />
        <div id="currentArtFallback" class="album-art-lg">Album Art</div>
        <div class="track-info-lg">
          <h2 id="currentTitle">Ucha Lamba Kad (From "Welcome")</h2>
          <p id="currentArtist">Anand Raj Anand</p>
        </div>
      </div>
    </div>

    <!-- Recent Vibe History -->
    <div class="history-section">
      <h3>Recent Vibe History</h3>
      <div class="vibe-list" id="vibeHistoryList">
        <div class="vibe-item">
          <div class="album-art-sm">Art</div>
          <div class="track-info-sm">
            <h4>Loading History...</h4>
            <p>Fetching online sync</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase & Sync Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyD6cTexajg5qthbeK3Z4lBwR-eIgojtI78",
      authDomain: "a7yrshitvc.firebaseapp.com",
      databaseURL: "https://a7yrshitvc-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "a7yrshitvc",
      storageBucket: "a7yrshitvc.firebasestorage.app",
      messagingSenderId: "383749658516",
      appId: "1:383749658516:web:5d2fc4b5b88c4191486181",
      measurementId: "G-HY0BJVR7WV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const LASTFM_USERNAME = "aarav"; // Aapka Last.fm username
    const LASTFM_API_KEY = "b2575223441e921d7b38d3ef7f015c32"; 
    let lastSavedTrack = "";

    // Clock Functionality
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Save Track to Firestore
    async function saveTrackToDb(title, artist, artUrl) {
      try {
        await addDoc(collection(db, "vibe_history"), {
          title: title,
          artist: artist,
          artUrl: artUrl || "",
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Firebase save error:", err);
      }
    }

    // Fetch Last.fm Realtime Data
    async function fetchLastFmTrack() {
      const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=1`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.recenttracks && data.recenttracks.track.length > 0) {
          const track = data.recenttracks.track[0];
          const title = track.name;
          const artist = track.artist['#text'];
          const artUrl = track.image ? track.image[2]['#text'] : "";
          const isNowPlaying = track['@attr'] && track['@attr'].nowplaying === "true";

          document.getElementById('statusBadge').innerText = isNowPlaying ? "NOW PLAYING" : "LAST PLAYED";
          document.getElementById('currentTitle').innerText = title;
          document.getElementById('currentArtist').innerText = artist;

          const imgElem = document.getElementById('currentArt');
          const fallbackElem = document.getElementById('currentArtFallback');

          if (artUrl) {
            imgElem.src = artUrl;
            imgElem.style.display = "block";
            fallbackElem.style.display = "none";
          } else {
            imgElem.style.display = "none";
            fallbackElem.style.display = "flex";
          }

          const trackKey = `${artist} - ${title}`;
          if (trackKey !== lastSavedTrack) {
            lastSavedTrack = trackKey;
            await saveTrackToDb(title, artist, artUrl);
          }
        }
      } catch (err) {
        console.warn("Last.fm fetch error:", err);
      }
    }

    // Realtime Sync Listener for Recent Vibe History
    function listenToVibeHistory() {
      const q = query(collection(db, "vibe_history"), orderBy("createdAt", "desc"), limit(15));

      onSnapshot(q, (snapshot) => {
        const container = document.getElementById("vibeHistoryList");
        if (!container) return;

        if (snapshot.empty) {
          container.innerHTML = "<p style='color:#666; font-size:0.9rem;'>No vibe history found.</p>";
          return;
        }

        container.innerHTML = snapshot.docs.map(doc => {
          const data = doc.data();
          const artHtml = data.artUrl 
            ? `<img class="album-art-sm" src="${escapeHTML(data.artUrl)}" alt="Art" />` 
            : `<div class="album-art-sm">Art</div>`;

          return `
            <div class="vibe-item">
              ${artHtml}
              <div class="track-info-sm">
                <h4>${escapeHTML(data.title || "Unknown Title")}</h4>
                <p>${escapeHTML(data.artist || "Unknown Artist")}</p>
              </div>
            </div>
          `;
        }).join("");
      });
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Initialize
    listenToVibeHistory();
    fetchLastFmTrack();
    setInterval(fetchLastFmTrack, 12000); // Check every 12 seconds
  </script>
</body>
</html>
