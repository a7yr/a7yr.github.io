<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarav is Vibing to &lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .card {
      background: #0f0f11;
      border: 1px solid #1a1a1e;
      border-radius: 16px;
      padding: 20px;
    }

    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #8e8e93;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #e50914;
      border-radius: 50%;
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background: #1a1a1e;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-lg h2 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .track-info-lg p {
      color: #a0a0a0;
      font-size: 0.95rem;
    }

    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0f0f11;
      border: 1px solid #18181c;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #1a1a1e;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .track-info-sm p {
      color: #888888;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">12:00:00 AM</span> 🕒</span>
      </div>
    </header>

    <div class="card now-playing-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="statusBadge">NOW PLAYING</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><rect width='90' height='90' fill='%231a1a1e'/></svg>" alt="Album Art" />
        <div class="track-info-lg">
          <h2 id="currentTitle">Loading track...</h2>
          <p id="currentArtist">Please wait</p>
        </div>
      </div>
    </div>

    <div class="history-section">
      <h3>Recent Vibe History (Last 10 Songs)</h3>
      <div class="vibe-list" id="vibeHistoryList">
        <div class="vibe-item">
          <div class="track-info-sm">
            <h4>Loading Activity...</h4>
            <p>Fetching album covers...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LASTFM_USERNAME = "a7yr";
    const LASTFM_API_KEY = "b31d67b732b6bb6f66ca8f9c033b97c1";

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Cleaning song titles aggressively to maximize API matches
    function cleanTitleAndArtist(rawTitle, rawArtist) {
      let cleanTitle = rawTitle
        .replace(/\(from ".*?"\)/gi, '')
        .replace(/\(from '.*?'\)/gi, '')
        .replace(/\[.*?\]|\(.*?\)/g, '')
        .replace(/- single|- remix|- original soundtrack/gi, '')
        .trim();
      
      let cleanArtist = rawArtist.split(/&|,|feat\.|ft\./i)[0].trim();
      return {
        query: encodeURIComponent(`${cleanTitle} ${cleanArtist}`),
        titleOnly: encodeURIComponent(cleanTitle)
      };
    }

    // MULTI-PROVIDER COVER ART ENGINE
    async function getCoverArtUrl(title, artist, rawLastFmArt) {
      if (rawLastFmArt && rawLastFmArt.trim() !== "" && !rawLastFmArt.includes("2a9b3a5c119d2a7156f7c70c778c3194")) {
        return rawLastFmArt;
      }

      const { query, titleOnly } = cleanTitleAndArtist(title, artist);

      // 1. JioSaavn / Indian Music API Engine (Best for Bollywood / Punjabi / Indian tracks)
      try {
        const res = await fetch(`https://saavn.dev/api/search/songs?query=${query}&limit=1`);
        const data = await res.json();
        if (data.data && data.data.results && data.data.results.length > 0) {
          const imgs = data.data.results[0].image;
          if (imgs && imgs.length > 0) return imgs[imgs.length - 1].url;
        }
      } catch (e) {}

      // 2. iTunes Search API (Query search)
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
        }
      } catch (e) {}

      // 3. iTunes Search API (Title only search fallback)
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${titleOnly}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
        }
      } catch (e) {}

      // 4. Deezer API
      try {
        const res = await fetch(`https://api.deezer.com/search?q=${query}&limit=1`);
        const data = await res.json();
        if (data.data && data.data.length > 0 && data.data[0].album && data.data[0].album.cover_medium) {
          return data.data[0].album.cover_medium;
        }
      } catch (e) {}

      return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'><rect width='90' height='90' fill='%231a1a1e'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23888' font-size='14'>Art</text></svg>";
    }

    // MAIN DATA SYNCHRONIZER
    async function refreshMusicFeed() {
      const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=10`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.recenttracks && data.recenttracks.track.length > 0) {
          const tracks = data.recenttracks.track;
          const current = tracks[0];

          const isNowPlaying = current['@attr'] && current['@attr'].nowplaying === "true";
          const currentTitle = current.name;
          const currentArtist = current.artist['#text'];
          const rawArt = current.image ? current.image[current.image.length - 1]['#text'] : "";

          document.getElementById('statusBadge').innerText = isNowPlaying ? "NOW PLAYING" : "LAST PLAYED";
          document.getElementById('currentTitle').innerText = currentTitle;
          document.getElementById('currentArtist').innerText = currentArtist;

          // Resolve Now Playing artwork first
          const currentCover = await getCoverArtUrl(currentTitle, currentArtist, rawArt);
          document.getElementById('currentArt').src = currentCover;

          // Resolve artwork for all 10 tracks before updating DOM
          const historyCards = await Promise.all(tracks.slice(0, 10).map(async (item) => {
            const title = item.name;
            const artist = item.artist['#text'];
            const itemRawArt = item.image ? item.image[item.image.length - 1]['#text'] : "";

            const artUrl = await getCoverArtUrl(title, artist, itemRawArt);

            return `
              <div class="vibe-item">
                <img class="album-art-sm" src="${escapeHTML(artUrl)}" alt="Art" />
                <div class="track-info-sm">
                  <h4>${escapeHTML(title)}</h4>
                  <p>${escapeHTML(artist)}</p>
                </div>
              </div>
            `;
          }));

          document.getElementById('vibeHistoryList').innerHTML = historyCards.join('');
        }
      } catch (err) {
        console.warn("Feed update error:", err);
      }
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    refreshMusicFeed();
    setInterval(refreshMusicFeed, 10000); // Syncs every 10 sec
  </script>
</body>
</html>
