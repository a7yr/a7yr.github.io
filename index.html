<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AaravReallyGoneCrazy&lt;3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --accent-color: #66fcf1;
      --accent-glow: rgba(102, 252, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #ffffff 30%, #66fcf1 100%);
    }

    body {
      background-color: #050505;
      color: #f0f0f5;
      display: flex;
      justify-content: center;
      padding: 45px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      transition: background-color 1s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Dynamic Background Glow */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(5, 5, 5, 0) 70%);
      z-index: 0;
      pointer-events: none;
      transition: background 1.2s ease-in-out;
      filter: blur(70px);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
      transition: background 0.8s ease;
    }

    .subtitle {
      color: #a0a0ab;
      font-size: 0.92rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: opacity 0.2s, color 0.8s ease;
    }

    .nav-link:hover {
      opacity: 0.8;
    }

    /* Protected Vibe Card */
    .status-card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .status-display {
      font-size: 0.92rem;
      color: #c5c5d0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-pill {
      font-weight: 700;
      color: var(--accent-color);
      word-break: break-word;
    }

    .edit-toggle-btn {
      background: transparent;
      border: none;
      color: #6e6e7a;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .edit-toggle-btn:hover {
      color: #a0a0ab;
    }

    .status-input-group {
      display: none;
      gap: 8px;
      margin-top: 4px;
    }

    .status-input-group.active {
      display: flex;
    }

    .status-input-group input {
      flex: 1;
      background: #15151a;
      border: 1px solid #282830;
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .status-input-group input:focus {
      border-color: var(--accent-color);
    }

    .status-input-group button {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.8s ease;
    }

    .status-input-group button:hover {
      opacity: 0.9;
    }

    .card {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
      transition: border-color 0.8s ease, box-shadow 0.8s ease;
    }

    .now-playing-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-color: var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8e8e98;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
      transition: background-color 0.8s ease, box-shadow 0.8s ease;
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .album-art-lg {
      width: 92px;
      height: 92px;
      border-radius: 12px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .track-info-lg h2 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .track-info-lg p {
      color: #a5a5b0;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .history-section h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-item {
      background: #0d0d10;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .vibe-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
      background: #121216;
    }

    .album-art-sm {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #15151a;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .track-info-sm h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
      color: #f0f0f5;
    }

    .track-info-sm p {
      color: #888892;
      font-size: 0.83rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientGlow"></div>

  <div class="wrapper">
    <header>
      <h1>Aarav is Vibing to &lt;3</h1>
      <div class="subtitle">
        <span>Live music tracking bwhahaha</span>
        <span>•</span>
        <span>Local Time: <span id="clock">--:--:--</span> 🕒</span>
      </div>
      <div style="margin-top: 10px;">
        <a href="favs.html" class="nav-link">♥ View Favorite Songs</a>
      </div>
    </header>

    <!-- Protected Status Display -->
    <div class="status-card">
      <div class="status-display">
        <div>
          <span style="color: #90909a; font-weight: 500;">Current Mood:</span>
          <span class="status-pill" id="liveStatusText">Chillin &amp; Listening 🎧</span>
        </div>
        <button class="edit-toggle-btn" id="toggleEditBtn">Edit Mood 🔒</button>
      </div>

      <div class="status-input-group" id="statusInputGroup">
        <input type="text" id="statusInput" placeholder="Enter new vibe status..." />
        <button id="updateStatusBtn">Save</button>
      </div>
    </div>

    <!-- Main Now Playing Card -->
    <div class="card now-playing-card" id="nowPlayingCard">
      <div class="badge">
        <span class="badge-dot" id="badgeDot"></span>
        <span id="statusBadge">NOW PLAYING</span>
      </div>
      <div class="track-main">
        <img id="currentArt" class="album-art-lg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='92' viewBox='0 0 92 92'><rect width='92' height='92' fill='%2315151a'/><circle cx='46' cy='46' r='18' fill='none' stroke='%23333' stroke-width='4'/></svg>" alt="Album Art" />
        <div class="track-info-lg">
          <h2 id="currentTitle">Fetching Vibe...</h2>
          <p id="currentArtist">Live track loading</p>
        </div>
      </div>
    </div>

    <!-- Recent Vibe History Section -->
    <div class="history-section">
      <h3>Recent Activities ^_^</h3>
      <div class="vibe-list" id="vibeHistoryList">
        <div class="vibe-item">
          <div class="track-info-sm">
            <h4>Syncing History...</h4>
            <p>Please wait a moment</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LASTFM_USERNAME = "a7yr";
    const LASTFM_API_KEY = "b31d67b732b6bb6f66ca8f9c033b97c1";
    const ADMIN_PASSCODE = "aarav123";
    const RTDB_MOOD_URL = "https://a7yrshitvc-default-rtdb.asia-southeast1.firebasedatabase.app/current_mood.json";
    const CLEAN_FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='92' height='92' viewBox='0 0 92 92'><rect width='92' height='92' fill='%2315151a'/><circle cx='46' cy='46' r='18' fill='none' stroke='%23333' stroke-width='4'/></svg>";

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const toggleEditBtn = document.getElementById("toggleEditBtn");
    const statusInputGroup = document.getElementById("statusInputGroup");
    const statusElem = document.getElementById("liveStatusText");

    toggleEditBtn.addEventListener("click", () => {
      if (statusInputGroup.classList.contains("active")) {
        statusInputGroup.classList.remove("active");
        toggleEditBtn.innerText = "Edit Mood 🔒";
      } else {
        const pass = prompt("Enter Admin Secret Key to edit mood:");
        if (pass === ADMIN_PASSCODE) {
          statusInputGroup.classList.add("active");
          toggleEditBtn.innerText = "Close ✖";
        } else if (pass !== null) {
          alert("Incorrect Passcode! Access Denied.");
        }
      }
    });

    async function fetchUniversalMood() {
      try {
        const res = await fetch(RTDB_MOOD_URL);
        if (res.ok) {
          const data = await res.json();
          if (data && data.text) {
            statusElem.innerText = data.text;
          }
        }
      } catch (e) {}
    }

    async function updateCustomStatus(statusText) {
      if (!statusText || !statusText.trim()) return;
      const textToSave = statusText.trim();
      
      try {
        await fetch(RTDB_MOOD_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: textToSave, updatedAt: new Date().toISOString() })
        });

        statusElem.innerText = textToSave;
        document.getElementById("statusInput").value = "";
        statusInputGroup.classList.remove("active");
        toggleEditBtn.innerText = "Edit Mood 🔒";
      } catch (e) {
        console.error("Error writing mood:", e);
      }
    }

    document.getElementById("updateStatusBtn").addEventListener("click", () => {
      const input = document.getElementById("statusInput");
      updateCustomStatus(input.value);
    });

    document.getElementById("statusInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        updateCustomStatus(e.target.value);
      }
    });

    function cleanSearchQuery(title, artist) {
      const cleanTitle = title.replace(/\(from ".*?"\)/gi, '')
                             .replace(/\[.*?\]|\(.*?\)/g, '')
                             .replace(/- single|- remix/gi, '')
                             .trim();
      const cleanArtist = artist.split(/&|,|feat\.|ft\./i)[0].trim();
      return encodeURIComponent(`${cleanTitle} ${cleanArtist}`);
    }

    // MULTI-PROVIDER ULTIMATE SCRAPER
    async function getUniversalHighResCoverArt(title, artist, rawLastFmArt) {
      // 0. Check if Last.fm gave a valid art (Ignore 2a9b3a5c star placeholder)
      if (rawLastFmArt && rawLastFmArt.trim() !== "" && !rawLastFmArt.includes("2a9b3a5c119d2a7156f7c70c778c3194")) {
        return rawLastFmArt;
      }

      const qStr = cleanSearchQuery(title, artist);

      // 1. JioSaavn Scraper (Best for Indian/Regional/Bollywood tracks like Laado)
      try {
        const res = await fetch(`https://saavn.dev/api/search/songs?query=${qStr}&limit=1`);
        const data = await res.json();
        if (data.data && data.data.results && data.data.results.length > 0) {
          const imgs = data.data.results[0].image;
          if (imgs && imgs.length > 0) return imgs[imgs.length - 1].url;
        }
      } catch (e) {}

      // 2. Deezer API Scraper
      try {
        const res = await fetch(`https://api.deezer.com/search?q=${qStr}&limit=1`);
        const data = await res.json();
        if (data.data && data.data.length > 0 && data.data[0].album.cover_big) {
          return data.data[0].album.cover_big;
        }
      } catch (e) {}

      // 3. Apple iTunes API Scraper
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${qStr}&entity=song&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
          return data.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
        }
      } catch (e) {}

      // 4. DuckDuckGo Fast Image Scraper (Catches cover from Google Images / YT Music)
      try {
        const ddgRes = await fetch(`https://api.duckduckgo.com/?q=${qStr}+song+cover+art&format=json`);
        const ddgData = await ddgRes.json();
        if (ddgData.Image) return ddgData.Image;
      } catch (e) {}

      return CLEAN_FALLBACK_SVG;
    }

    async function checkLiveLastFmTrack() {
      const url = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=5`;

      try {
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();

        if (data.recenttracks && data.recenttracks.track.length > 0) {
          const tracks = data.recenttracks.track;
          const current = tracks[0];
          const title = current.name;
          const artist = current.artist['#text'];
          const rawArt = current.image ? current.image[current.image.length - 1]['#text'] : "";
          const isNowPlaying = current['@attr'] && current['@attr'].nowplaying === "true";

          document.getElementById('statusBadge').innerText = isNowPlaying ? "NOW PLAYING" : "LAST PLAYED";
          document.getElementById('currentTitle').innerText = title;
          document.getElementById('currentArtist').innerText = artist;

          // Fetch High-Res Cover with Multi-Service Fallbacks
          getUniversalHighResCoverArt(title, artist, rawArt).then(coverUrl => {
            document.getElementById('currentArt').src = coverUrl;
          });

          // Render History with Scraped Cover Arts
          const historyContainer = document.getElementById('vibeHistoryList');
          if (historyContainer && tracks.length > 1) {
            const historyTracks = tracks.slice(1, 6);
            
            historyContainer.innerHTML = historyTracks.map((track, idx) => {
              const tTitle = track.name || "Unknown Track";
              const tArtist = track.artist ? track.artist['#text'] : "Unknown Artist";
              const tRawArt = (track.image && track.image[track.image.length - 1]['#text']) ? track.image[track.image.length - 1]['#text'] : "";

              return `
                <div class="vibe-item" id="hist-item-${idx}">
                  <img class="album-art-sm" id="hist-img-${idx}" src="${CLEAN_FALLBACK_SVG}" alt="Art" />
                  <div class="track-info-sm">
                    <h4>${escapeHTML(tTitle)}</h4>
                    <p>${escapeHTML(tArtist)}</p>
                  </div>
                </div>
              `;
            }).join('');

            // Asynchronously resolve history cover arts using Scraper
            historyTracks.forEach((track, idx) => {
              const tTitle = track.name || "";
              const tArtist = track.artist ? track.artist['#text'] : "";
              const tRawArt = (track.image && track.image[track.image.length - 1]['#text']) ? track.image[track.image.length - 1]['#text'] : "";
              
              getUniversalHighResCoverArt(tTitle, tArtist, tRawArt).then(artUrl => {
                const imgElem = document.getElementById(`hist-img-${idx}`);
                if (imgElem) imgElem.src = artUrl;
              });
            });
          }
        }
      } catch (err) {
        console.warn("Last.fm sync error:", err);
      }
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    fetchUniversalMood();
    checkLiveLastFmTrack();

    setInterval(fetchUniversalMood, 5000);
    setInterval(checkLiveLastFmTrack, 8000);
  </script>
</body>
</html>
